services:
  neo4j:
    image: neo4j:5-community
    container_name: tournament-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:-change-me-before-production}
    volumes:
      - neo4j_data:/data

volumes:
  neo4j_data:
